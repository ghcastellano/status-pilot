# manifest.yml — app Forge FINO do Status Pilot (Forge Remote → backend Vercel).
#
# Este app NÃO tem lógica de métricas: ele só (1) é instalado pelo ADMIN do site
# — o que concede os scopes `asApp` — e (2) encaminha invocações (trigger agendado)
# para o nosso backend externo (Vercel) via Forge Remote, injetando o token asApp.
# Toda a inteligência continua no Vercel/Supabase (ver docs/FORGE.md).
#
# É EXATAMENTE o padrão da ActionableAgile/55 Degrees: Forge fino + backend próprio.
#
# ⚠️ `forge lint` é a AUTORIDADE do schema. Rode-o após editar.
#    Docs: https://developer.atlassian.com/platform/forge/manifest-reference/

# `app.id` é gerado por `forge register`.
app:
  id: ari:cloud:ecosystem::app/53ed5828-17ac-4b65-b4e5-17e0f765774e
  runtime:
    name: nodejs22.x

# Scopes concedidos pelo ADMIN na instalação → é o que o asApp pode ler.
# Granular e mínimo (bom p/ review do Marketplace): só leitura de work + Agile.
# O egress p/ o backend é implícito pelo `remotes` abaixo (não precisa external.fetch).
permissions:
  scopes:
    - read:jira-work
    - read:board-scope:jira-software
    - read:sprint:jira-software

# Backend externo (Vercel) registrado como remote, com token asApp habilitado.
# baseUrl = URL de PRODUÇÃO real deste projeto (o `status-pilot.vercel.app` sem
# escopo é OUTRO projeto/app — não é este Next.js).
remotes:
  - key: status-pilot-backend
    baseUrl: https://status-pilot-gustavos-projects-287c5dd3.vercel.app
    auth:
      # injeta `x-forge-oauth-system` (token asApp) nas chamadas ao remote —
      # é o token que o /api/forge/sync usa p/ chamar a Jira como o app.
      appSystemToken:
        enabled: true

modules:
  # Sync em background: a cada hora o Forge invoca o nosso endpoint remoto.
  # (o token asApp tem TTL ~4h e é renovável a qualquer momento — casa com isto.)
  scheduledTrigger:
    - key: status-pilot-hourly-sync
      interval: hour
      endpoint: sync-endpoint

  # Endpoint remoto = rota no nosso backend Vercel.
  endpoint:
    - key: sync-endpoint
      remote: status-pilot-backend
      route:
        path: /api/forge/sync

# NOTA: a page do app dentro do Jira (jira:globalPage) fica p/ a Fase 2 — o Forge
# exige recurso estático LOCAL (resources.path), então uma UI hospedada no Vercel
# entra via Custom UI/remote resource depois. O spike prova o asApp pelo trigger.
