name: Jira flow simulator

# Movimenta cards REAIS no lavrai (datas de changelog reais) e re-sincroniza o
# Supabase. Roda 3x/dia para gerar andamento contínuo — grátis (GitHub Actions).
# Segredos: JIRA_* e SUPABASE_* configurados em Settings → Secrets → Actions.

on:
  schedule:
    - cron: "0 9,15,21 * * *" # 09h, 15h, 21h UTC
  workflow_dispatch: {} # permite disparar manualmente

concurrency:
  group: jira-sim
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY_SCRUM: ${{ secrets.JIRA_PROJECT_KEY_SCRUM }}
      JIRA_PROJECT_KEY_KANBAN: ${{ secrets.JIRA_PROJECT_KEY_KANBAN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Tick de movimento (cards + sprints reais)
        run: npx tsx scripts/simulate-jira-flow.ts
      - name: Re-sincroniza Supabase (times reais)
        run: |
          npx tsx -e '
            import { syncIssuesFromJira } from "./lib/sync";
            (async () => {
              for (const t of ["board-4","board-5"]) {
                const r = await syncIssuesFromJira(t);
                console.log(t, "→", JSON.stringify(r.byTeam));
              }
            })().catch(e => { console.error(e.message); process.exit(1); });
          '
